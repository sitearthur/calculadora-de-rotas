<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de Rotas – São Paulo</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="busca">
    <div class="topo">
      <h1>Rotas SP</h1>
      <button id="btn-tema" class="icone-btn" type="button" aria-label="Alternar tema claro/escuro" title="Alternar tema">
        <span class="material-symbols-outlined">dark_mode</span>
      </button>
    </div>

    <div class="campos">
      <div class="campo" id="campo-origem">
        <span class="pino pino-origem" aria-hidden="true"></span>
        <input id="origem" type="text" placeholder="De onde você sai?" autocomplete="off" aria-label="Origem">
        <button id="btn-gps" class="icone-btn" type="button" aria-label="Usar minha localização atual" title="Usar minha localização atual">
          <span class="material-symbols-outlined">my_location</span>
        </button>
        <button class="icone-btn btn-salvar" data-tipo="origem" type="button" aria-label="Salvar origem nos favoritos" title="Salvar nos favoritos">
          <span class="material-symbols-outlined">bookmark</span>
        </button>
        <div class="dropdown" id="dd-origem" hidden></div>
      </div>

      <div class="campo" id="campo-destino">
        <span class="pino pino-destino" aria-hidden="true"></span>
        <input id="destino" type="text" placeholder="Para onde você vai?" autocomplete="off" aria-label="Destino">
        <button class="icone-btn btn-salvar" data-tipo="destino" type="button" aria-label="Salvar destino nos favoritos" title="Salvar nos favoritos">
          <span class="material-symbols-outlined">bookmark</span>
        </button>
        <div class="dropdown" id="dd-destino" hidden></div>
      </div>

      <button id="btn-calcular" type="button">Calcular rota</button>
    </div>
    <p id="aviso" role="status"></p>
  </header>

  <main>
    <div id="mapa"></div>
    <section class="rotas">
      <p class="placeholder">As rotas aparecerão aqui em breve.</p>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
